[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]
build-backend = "setuptools.build_meta"


[project]
name = "project-knowledge-engine"

version = "0.1.0"

description = "Semantic knowledge engine for AI assisted software development"

requires-python = ">=3.12"

authors = [
    {name = "PKE Team"}
]


dependencies = [
    "pyyaml",
    "pydantic"
]


[project.optional-dependencies]

dev = [
    "pytest",
    "ruff",
    "mypy"
]


[project.scripts]

pke = "pke.cli.main:main"


[tool.setuptools.packages.find]

where = [
    "src"
]